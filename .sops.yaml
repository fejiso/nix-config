creation_rules:
  # Shared secrets - used by both home-manager (user key) and system services (host keys)
  - path_regex: 'secrets/(openrouter|opencodego|zai)\.yaml$'
    age:
      - *user_ssh
      - *user_age
      - *elitedx_ssh
      - *blacktop_ssh
      - *hierro_ssh
      - *butthead_ssh
      - *lenovix_ssh
      - *hispanas_ssh
      - *snuffles_ssh
      - *z_turn_ssh
      - *kr260_ssh
      - *elitedex_age
      - *hierro_age
      - *blacktop_age
      - *butthead_age
      - *lenovix_age
      - *hispanas_age
      - *snuffles_age
      - *z_turn_age
      - *kr260_age

  # Home-manager secrets - use user SSH key
  - path_regex: 'secrets/(git-credentials-age|beets|music|atuin)\.yaml$'
    age:
      - *user_ssh
      - *user_age

  # Agent "sauce" — a plain markdown file, sops-encrypted as binary so `sops
  # secrets/agents.md` edits real markdown (not a YAML string). User-only: it's
  # pure home-manager personal instructions, no system service reads it.
  - path_regex: 'secrets/agents\.md$'
    age:
      - *user_ssh
      - *user_age

  # System/host secrets - use host SSH keys and age keys
  - path_regex: 'secrets/.*$'
    age:
      - *elitedx_ssh
      - *blacktop_ssh
      - *hierro_ssh
      - *butthead_ssh
      - *lenovix_ssh
      - *hispanas_ssh
      - *snuffles_ssh
      - *z_turn_ssh
      - *kr260_ssh
      - *user_ssh
      - *elitedex_age
      - *hierro_age
      - *blacktop_age
      - *butthead_age
      - *lenovix_age
      - *hispanas_age
      - *snuffles_age
      - *z_turn_age
      - *kr260_age

