creation_rules:
  # Home-manager secrets - use user SSH key
  - path_regex: 'secrets/git-credentials-age\.yaml$'
    age: *user_ssh

  # System/host secrets - use host SSH keys and age keys
  - path_regex: 'secrets/.*$'
    age:
      - *blacktop_ssh
      - *hierro_ssh
      - *butthead_ssh
      - *lenovix_ssh
      - *user_ssh
      - *hierro_age
      - *blacktop_age
      - *butthead_age
      - *lenovix_age
      
