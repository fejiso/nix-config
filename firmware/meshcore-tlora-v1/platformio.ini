[LilyGo_TLora_V1_0]
extends = esp32_base
board = ttgo-lora32-v1
build_unflags = -Os
build_type = release
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -UENV_INCLUDE_GPS
  -I variants/lilygo_tlora_v1
  -Os -ffunction-sections -fdata-sections
  -D LILYGO_TLORA_V1_0
  -D P_LORA_DIO_0=26
  -D P_LORA_DIO_1=33
  -D P_LORA_NSS=18
  -D P_LORA_RESET=14
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=27
  -D P_LORA_TX_LED=2
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=15
  -D PIN_OLED_RESET=16
  -D PIN_USER_BTN=0
  -D ARDUINO_LOOP_STACK_SIZE=16384
  -D DISPLAY_CLASS=SSD1306Display
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=TLoraSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_CR=8
  -D LORA_TX_POWER=20
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../variants/lilygo_tlora_v1>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:LilyGo_TLora_V1_0_kiss_modem]
extends = LilyGo_TLora_V1_0
build_src_filter = ${LilyGo_TLora_V1_0.build_src_filter}
  +<../examples/kiss_modem/>

[env:LilyGo_TLora_V1_0_repeater]
extends = LilyGo_TLora_V1_0
build_src_filter = ${LilyGo_TLora_V1_0.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${LilyGo_TLora_V1_0.build_flags}
  -D ADVERT_NAME='"TLora-V1.0 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${LilyGo_TLora_V1_0.lib_deps}
  ${esp32_ota.lib_deps}

[env:LilyGo_TLora_V1_0_companion_radio_usb]
extends = LilyGo_TLora_V1_0
build_flags =
  ${LilyGo_TLora_V1_0.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
build_src_filter = ${LilyGo_TLora_V1_0.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TLora_V1_0.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TLora_V1_0_companion_radio_ble]
extends = LilyGo_TLora_V1_0
build_flags =
  ${LilyGo_TLora_V1_0.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
build_src_filter = ${LilyGo_TLora_V1_0.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TLora_V1_0.lib_deps}
  densaugeo/base64 @ ~1.4.0
